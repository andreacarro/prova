<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andrea Carro - L'acrobata bendato</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            width: 100%;
            font-family: 'Georgia', 'Times New Roman', serif;
            overflow-x: hidden;
            background-color: #1a0f07;
        }

        /* Immagine di sfondo visibile a schermo intero */
        .bg-img {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            object-position: center center;
            z-index: 1;
        }

        /* 2. Player Audio in basso al centro */
        .player-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 480px;
            background: linear-gradient(135deg, rgba(58, 42, 33, 0.92), rgba(30, 20, 15, 0.95));
            border: 2px solid #c59b27;
            border-radius: 12px;
            padding: 15px 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7), inset 0 0 10px rgba(197, 155, 39, 0.2);
            color: #f4e8c1;
            text-align: center;
            z-index: 10;
        }

        .player-title {
            font-size: 1.05rem;
            font-weight: bold;
            color: #e6c669;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            text-shadow: 1px 1px 2px #000;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        audio {
            width: 100%;
            height: 36px;
            margin-bottom: 10px;
            filter: sepia(0.2) contrast(0.9) opacity(0.9);
        }

        .player-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .btn-nav {
            background: linear-gradient(180deg, #8b261d, #5a140e);
            color: #f4e8c1;
            border: 1px solid #c59b27;
            padding: 6px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: bold;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
        }

        .btn-nav:hover {
            background: linear-gradient(180deg, #a63227, #731b14);
            color: #ffffff;
            box-shadow: 0 0 8px rgba(197, 155, 39, 0.6);
        }

        .track-indicator {
            font-size: 0.8rem;
            color: #bfa882;
        }

        /* 3. Bottone Sostieni il progetto (in basso a destra fuori dal disegno) */
        .btn-sostieni {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(180deg, #c59b27, #8a6a14);
            color: #1a0f07;
            border: 2px solid #fff;
            padding: 12px 22px;
            border-radius: 25px;
            font-family: inherit;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            transition: all 0.3s ease;
            z-index: 99;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-sostieni:hover {
            transform: scale(1.05);
            background: linear-gradient(180deg, #e6c669, #a37f1a);
            box-shadow: 0 0 15px rgba(230, 198, 105, 0.8);
        }

        /* Modal / Box Form */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(3px);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-box {
            position: relative;
            background: linear-gradient(135deg, #2b1d14, #150c07);
            border: 2px solid #c59b27;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9), inset 0 0 15px rgba(197, 155, 39, 0.15);
            color: #f4e8c1;
        }

        .btn-close {
            position: absolute;
            top: 12px;
            right: 15px;
            background: transparent;
            border: none;
            color: #c59b27;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            line-height: 1;
            transition: color 0.2s;
        }

        .btn-close:hover {
            color: #ff5555;
        }

        .modal-header {
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 20px;
            padding-right: 20px;
            color: #e6c669;
            text-align: left;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 5px;
            color: #bfa882;
        }

        .form-group input, 
        .form-group textarea {
            width: 100%;
            background: rgba(10, 5, 2, 0.8);
            border: 1px solid #7a5f1c;
            border-radius: 6px;
            padding: 10px;
            color: #f4e8c1;
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
        }

        .form-group input:focus, 
        .form-group textarea:focus {
            border-color: #c59b27;
            box-shadow: 0 0 5px rgba(197, 155, 39, 0.5);
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(180deg, #8b261d, #5a140e);
            color: #f4e8c1;
            border: 1px solid #c59b27;
            padding: 10px;
            border-radius: 6px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: linear-gradient(180deg, #a63227, #731b14);
            color: #ffffff;
            box-shadow: 0 0 10px rgba(197, 155, 39, 0.5);
        }
    </style>
</head>
<body>

    <!-- Tag IMG diretto per lo sfondo -->
    <img src="1000316858.jpg" alt="Sfondo L'acrobata bendato" class="bg-img">

    <!-- Player Audio -->
    <div class="player-container">
        <div class="player-title" id="track-title">Caricamento...</div>
        <audio id="audio-player" controls></audio>
        <div class="player-nav">
            <button class="btn-nav" onclick="prevTrack()">&laquo; Precedente</button>
            <span class="track-indicator" id="track-indicator">1 / 4</span>
            <button class="btn-nav" onclick="nextTrack()">Successiva &raquo;</button>
        </div>
    </div>

    <!-- Bottone Sostieni -->
    <button class="btn-sostieni" onclick="openModal()">sostieni il progetto</button>

    <!-- Modal Form -->
    <div class="modal-overlay" id="modal">
        <div class="modal-box">
            <button class="btn-close" onclick="closeModal()">&times;</button>
            <div class="modal-header">
                Unisciti al viaggio: lascia la mail e verrai avvisato in anteprima al lancio del crowdfunding, e se vorrai partecipare sarai artefice della nascita dell'album.
            </div>
            <form action="https://formsubmit.co/acrobatabendato@gmail.com" method="POST">
                <input type="hidden" name="_subject" value="adesione crowfinding acrobata bendato">
                <input type="hidden" name="_captcha" value="false">
                
                <div class="form-group">
                    <label for="email">tua mail</label>
                    <input type="email" id="email" name="tua_mail" placeholder="tua mail" required>
                </div>
                
                <div class="form-group">
                    <label for="comments">commenti</label>
                    <textarea id="comments" name="commenti" rows="4" placeholder="commenti"></textarea>
                </div>
                
                <button type="submit" class="btn-submit">invia</button>
            </form>
        </div>
    </div>

    <script>
        const playlist = [
            { title: "Le tre vite", src: "le tre vite.mp3" },
            { title: "Serenata§3", src: "serenata§3.mp3" },
            { title: "L'acrobata bendato", src: "l'acrobata bendato.mp3" },
            { title: "Il mostro", src: "il mostro.mp3" }
        ];

        let currentTrackIndex = 0;

        const audioPlayer = document.getElementById('audio-player');
        const trackTitle = document.getElementById('track-title');
        const trackIndicator = document.getElementById('track-indicator');

        function loadTrack(index) {
            currentTrackIndex = index;
            audioPlayer.src = playlist[index].src;
            trackTitle.textContent = playlist[index].title;
            trackIndicator.textContent = `${index + 1} / ${playlist.length}`;
        }

        function prevTrack() {
            currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
            loadTrack(currentTrackIndex);
            audioPlayer.play();
        }

        function nextTrack() {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            loadTrack(currentTrackIndex);
            audioPlayer.play();
        }

        function openModal() {
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('modal');
            if (event.target === modal) {
                closeModal();
            }
        };

        // Inizializza la prima traccia
        loadTrack(0);
    </script>
</body>
</html>
